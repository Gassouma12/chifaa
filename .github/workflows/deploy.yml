name: Build & Deploy CHIFAA

# Push  -> build only (a safe CI check; never touches the live site).
# Manual "Run workflow" with deploy=true, OR the admin "Publish" button
# (repository_dispatch: publish) -> build AND deploy to OVH.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_to_ovh:
        description: 'Deploy the build to the live OVH site'
        type: boolean
        default: false
  repository_dispatch:
    types: [publish]

concurrency:
  group: deploy-chifaa
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chifaa-next
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chifaa-next/package-lock.json

      - run: npm install --no-audit --no-fund

      - name: Auto-translate new/changed articles (EN -> AR)
        run: node scripts/translate-supabase.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}

      - name: Build static site from Supabase
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # Legacy /assets/* are already on OVH and never change (new images go
      # to Supabase Storage). Skip them so deploys upload only app files (~2MB).
      - name: Strip legacy assets from build (already on OVH)
        if: ${{ github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.deploy_to_ovh) }}
        run: rm -rf out/assets

      # OVH filters GitHub's IPs on port 22 (SSH handshake times out — confirmed
      # with two SFTP clients). Port 21 works. OVH advertises FTPS (AUTH TLS) but
      # lftp's TLS handshake fails on Ubuntu's OpenSSL 3.x; plain FTP login is
      # proven working. So: try FTPS first, fall back to plain FTP — never fails.
      - name: Deploy to OVH via FTPS (plain-FTP fallback)
        if: ${{ github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.deploy_to_ovh) }}
        env:
          OVH_USER: ${{ secrets.SFTP_USER }}
          OVH_PASS: ${{ secrets.SFTP_PASSWORD }}
          OVH_HOST: ${{ secrets.SFTP_HOST }}
          OVH_DIR: ${{ secrets.SFTP_REMOTE_DIR }}
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          FTP_HOST="${OVH_HOST/sftp./ftp.}"; FTP_HOST="${FTP_HOST/ssh./ftp.}"
          DIR="${OVH_DIR#/}"                       # strip leading slash -> relative to login home
          echo "Target: $FTP_HOST -> $DIR/"

          run_mirror () {   # $1 = ssl config, $2 = max-retries
            lftp -c "
              $1
              set ftp:passive-mode true
              set net:max-retries ${2:-5}
              set net:timeout 40
              set net:reconnect-interval-base 5
              set mirror:parallel-transfer-count 3
              open -u '$OVH_USER','$OVH_PASS' 'ftp://$FTP_HOST'
              mirror --reverse --only-newer --verbose --exclude-glob '.git*' ./out/ '$DIR/'
              bye
            "
          }

          echo '== Attempt 1: FTPS (encrypted) =='
          if run_mirror "set ftp:ssl-force true; set ftp:ssl-auth TLS; set ftp:ssl-protect-data true; set ftp:ssl-protect-list true; set ssl:verify-certificate no" 2; then
            echo '✓ Deployed over FTPS (encrypted).'
          else
            echo '== FTPS handshake failed -> Attempt 2: plain FTP (port 21) =='
            run_mirror "set ftp:ssl-allow no" 5
            echo '✓ Deployed over plain FTP.'
          fi
